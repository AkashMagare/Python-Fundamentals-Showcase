[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-fundamentals-showcase"
version = "1.0.0"
description = "A beginner-friendly personal expense tracker CLI built with Python's standard library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Akash Magare" }
]

[tool.setuptools.packages.find]
include = ["app*"]
